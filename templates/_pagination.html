{# Phân trang dùng chung. Context cần: page, pages, params (dict bộ lọc), request #}
{% set base_path = request.url.path %}
<nav aria-label="Phân trang">
  <ul class="pagination pagination-sm justify-content-center mb-0 flex-wrap">
    <li class="page-item {{ 'disabled' if page == 1 }}"><a class="page-link" href="{{ page_url(base_path, params, 1) }}" aria-label="Trang đầu">&laquo;</a></li>
    <li class="page-item {{ 'disabled' if page == 1 }}"><a class="page-link" href="{{ page_url(base_path, params, page - 1) }}" aria-label="Trang trước">&lsaquo;</a></li>
    {% for n in range([1, page - 2] | max, [pages, page + 2] | min + 1) %}
      <li class="page-item {{ 'active' if n == page }}"><a class="page-link" href="{{ page_url(base_path, params, n) }}">{{ n }}</a></li>
    {% endfor %}
    <li class="page-item {{ 'disabled' if page == pages }}"><a class="page-link" href="{{ page_url(base_path, params, page + 1) }}" aria-label="Trang sau">&rsaquo;</a></li>
    <li class="page-item {{ 'disabled' if page == pages }}"><a class="page-link" href="{{ page_url(base_path, params, pages) }}" aria-label="Trang cuối">&raquo;</a></li>
  </ul>
</nav>
