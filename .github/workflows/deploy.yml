# Build image -> đẩy lên GHCR -> SSH vào VPS chạy docker compose.
# Cần các Secrets: VPS_HOST, VPS_USERNAME, VPS_SSH_KEY, SECRET_KEY (3 secret VPS_* giống repo tuanhm_edge_proxy)
# Tùy chọn: VPS_PORT (mặc định 22), VPS_KNOWN_HOSTS, APP_ENV_EXTRA
# HTTPS cho dq.tuanhm.pro do edge-nginx (repo tuanhm_edge_proxy) cấp, workflow này không đụng tới proxy.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP_URL: https://dq.tuanhm.pro
  DEPLOY_PATH: /opt/dqcontrol

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.APP_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Deploy lên VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USERNAME }}
          PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          APP_ENV_EXTRA: ${{ secrets.APP_ENV_EXTRA }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          missing=0
          for pair in HOST:VPS_HOST USER:VPS_USERNAME SSH_KEY:VPS_SSH_KEY SECRET_KEY:SECRET_KEY; do
            var="${pair%%:*}" secret="${pair#*:}"
            if [ -z "${!var}" ]; then
              echo "::error::Thiếu repository secret $secret (Settings > Secrets and variables > Actions > tab Secrets)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          remote() { ssh -i ~/.ssh/id_deploy -p "$PORT" "$USER@$HOST" "$@"; }

          remote "mkdir -p '$DEPLOY_PATH'"
          scp -i ~/.ssh/id_deploy -P "$PORT" deploy/docker-compose.yml "$USER@$HOST:$DEPLOY_PATH/"

          # Bản demo: tài khoản + dữ liệu giả lập. Ghi đè/thêm biến qua secret APP_ENV_EXTRA (mỗi dòng KEY=VALUE).
          {
            printf 'SECRET_KEY=%s\n' "$SECRET_KEY"
            echo 'DEBUG=false'
            echo 'LOG_LEVEL=INFO'
            echo 'SESSION_HTTPS_ONLY=true'
            echo 'MOCK_LDAP=true'
            echo 'USE_MOCK_DATA=true'
            printf '%s\n' "$APP_ENV_EXTRA"
          } | remote "umask 077 && cat > '$DEPLOY_PATH/app.env'"
          echo "APP_IMAGE=$IMAGE:$GITHUB_SHA" | remote "cat > '$DEPLOY_PATH/.env'"

          printf '%s' "$REGISTRY_TOKEN" | remote "docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          remote "cd '$DEPLOY_PATH' && docker compose pull && docker compose up -d --remove-orphans; rc=\$?; docker logout ghcr.io; docker image prune -f >/dev/null; exit \$rc"

      - name: Kiểm tra /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$APP_URL/health"; then echo; exit 0; fi
            sleep 5
          done
          echo "::error::$APP_URL/health không phản hồi sau 150 giây (kiểm tra edge-nginx đã route dq.tuanhm.pro và đã có chứng chỉ chưa)"
          exit 1
